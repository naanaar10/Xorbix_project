<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Growth Agent</title>
  <meta name="description" content="Finds where chiropractic clinics lose money, works out why, and writes the fix for staff to approve.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%223%22 y=%221%22 width=%2210%22 height=%223%22 rx=%221.5%22 fill=%22%232D6E66%22/%3E%3Crect x=%225%22 y=%226.5%22 width=%2210%22 height=%223%22 rx=%221.5%22 fill=%22%23C03A4E%22/%3E%3Crect x=%223%22 y=%2212%22 width=%2210%22 height=%223%22 rx=%221.5%22 fill=%22%232D6E66%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1><a href="#overview">Growth Agent</a></h1>
      <p>Finds where clinics lose money, works out why, and writes the fix for staff to approve.</p>
    </div>
    <div class="topbar-right">
      <p class="goal" id="goal"></p>
      <button type="button" class="link" id="open-drawer">How it works</button>
    </div>
  </header>
  <div class="layout">
    <nav class="rail" aria-label="Clinics">
      <p class="rail-title" id="rail-title"></p>
      <div class="spine" id="spine"></div>
    </nav>
    <main class="panel" id="panel">
      <nav class="tabs" id="tabs" aria-label="Sections">
        <a href="#overview" data-tab="overview">Overview</a>
        <a href="#clinics" data-tab="clinics">Clinics</a>
        <a href="#diagnoses" data-tab="diagnoses">Problems</a>
        <a href="#outreach" data-tab="outreach">Messages</a>
        <a href="#results" data-tab="results">Results</a>
      </nav>
      <section class="live" id="live" hidden aria-label="Live run"></section>
      <div id="view"><p class="notice">Loading the clinic network…</p></div>
    </main>
  </div>
  <dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title">How it works</h2>
      <button type="button" class="link" id="close-drawer">Close</button>
    </div>
    <div id="drawer-body"></div>
  </dialog>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
