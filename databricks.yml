# Backbone: Databricks Asset Bundle.
# Workspace-specific values live in variables or in your CLI profile, never in code.
bundle:
  name: chiro-growth-agent

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds the bundle's schema.
    default: workspace
  schema:
    description: Schema for generated data, agent tools and agent outputs.
    default: chiro_growth
  warehouse_id:
    description: SQL warehouse used by the agent tools and the app.
    lookup:
      warehouse: Serverless Starter Warehouse
  llm_endpoint:
    description: Foundation Model serving endpoint the agents call.
    default: databricks-gpt-oss-120b
  clinics_per_run:
    description: How many clinics the Manager agent investigates per run.
    default: 3
  max_agent_patients:
    description: At-risk patients per clinic that get an individual agent review.
    default: 30

targets:
  # Your own sandbox: resources get a [dev you] prefix and schedules stay paused.
  dev:
    mode: development
    default: true

  # Any other workspace (for example the judges'): pick it with --profile or DATABRICKS_HOST.
  # Nothing workspace-specific is hard-coded; override variables with --var if needed.
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
