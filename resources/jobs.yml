resources:
  jobs:
    smoke_test:
      name: chiro-growth-smoke-test
      tasks:
        - task_key: smoke
          spark_python_task:
            python_file: ../src/jobs/smoke_test.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.chiro_growth.name}
              - --warehouse-id=${var.warehouse_id}
              - --llm-endpoint=${var.llm_endpoint}
              - --experiment-id=${resources.experiments.agent_traces.id}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.60
              - openai>=1.40
              - mlflow>=3.1

    generate_data:
      name: chiro-growth-generate-data
      description: Simulates the 50-clinic network (~$100M revenue) with planted problems and verifies them.
      tasks:
        - task_key: generate
          spark_python_task:
            python_file: ../src/jobs/generate_data.py
            parameters:
              - --catalog=${var.catalog}
              - --schema=${resources.schemas.chiro_growth.name}
              - --src-dir=${workspace.file_path}/src
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
