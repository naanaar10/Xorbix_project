[project]
name = "chiro-growth-agent"
version = "0.1.0"
description = "Growth Director: an agentic AI prototype for a chiropractic clinic network on Databricks."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pandas>=2.2", "databricks-sdk>=0.60", "mlflow-skinny>=3.1", "openai>=1.40", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
